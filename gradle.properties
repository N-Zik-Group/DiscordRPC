# Standalone build properties (root project = this repository).
# When this repository is used as a git submodule inside N-Zik, this file is
# NOT read — Gradle only loads gradle.properties from the root project
# (N-Zik's own file in that case).

# AGP 9.0+ enables built-in Kotlin by default, which rejects the classic
# kotlin("android") plugin. N-Zik builds with built-in Kotlin disabled, so we
# mirror that flag here to keep the module building identically in both
# contexts.
android.builtInKotlin=false
# AGP 9.0 enables the new DSL by default, which is not compatible with the
# classic kotlin("android") plugin. N-Zik builds with it disabled.
android.newDsl=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
kotlin.code.style=official
